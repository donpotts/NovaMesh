[package]
name = "ask2app-platform"
version = "1.0.0"
description = "Ask2App | My Platform Desktop Orchestrator"
authors = ["Ask2App"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
open = "5.3"