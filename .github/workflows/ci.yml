name: NovaMesh CI & Verification

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Restore Dependencies
        run: dotnet restore NovaMesh.sln

      - name: Build Solution
        run: dotnet build NovaMesh.sln --configuration Release --no-restore

      - name: Run DbMigrator & Seed Verification
        run: dotnet run --project src/NovaMesh.DbMigrator/NovaMesh.DbMigrator.csproj --configuration Release --no-build

      - name: Execute Automated xUnit Integration Tests
        run: dotnet test NovaMesh.sln --configuration Release --no-build --verbosity normal
